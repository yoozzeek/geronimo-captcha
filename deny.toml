[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained with no safe upgrade; it reaches only the embedded, trusted Roboto-Bold.ttf via ab_glyph. Escaping it means replacing the ab_glyph font stack with skrifa." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
