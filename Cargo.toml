[package]
name = "geronimo-captcha"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Andrew <zeek@tuta.com>"]
repository = "https://github.com/yoozzeek/geronimo-captcha"
keywords = ["captcha", "security", "web", "random", "no-js"]
description = "A JavaScript-free CAPTCHA for Rust. A speed bump for bulk automation, layered over server-side rate limiting. Not a wall."
documentation = "https://docs.rs/geronimo-captcha"
exclude = ["/examples/**", "/assets/examples/**", "/logo.jpg"]

[lib]
crate-type = ["rlib"]

[features]
parallel = ["dep:rayon", "image/rayon", "imageproc/rayon"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
webp = "0.3.1"
thiserror = "2.0.20"
rand = "0.10.2"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22.1"
dashmap = "6.2"
ab_glyph = "0.2.32"
uuid = { version = "1.24", features = ["v4"] }
subtle = "2.6"
tracing = "0.1.44"
zeroize = { version = "1.9", default-features = true }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"

[[bench]]
name = "captcha"
path = "benches/generate_verify.rs"
harness = false
